[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "number-factorizer"
version = "0.1.0"
description = "A simple Python package to find factors and prime factorization of numbers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sohan Ananthula", email = "sohanananthula2012@gmail.com"}
]
keywords = ["factorize", "factors", "prime", "math", "number-theory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/sohanananthula2012-ship-it/number-factorizer"
Repository = "https://github.com/sohanananthula2012-ship-it/number-factorizer"
